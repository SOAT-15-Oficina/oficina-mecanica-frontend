<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina - Aprovação de orçamento</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto py-10 px-4">

    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">Oficina</h1>
      <p class="text-gray-500 text-sm">Orçamento e acompanhamento da ordem de serviço</p>
    </div>

    <div id="payment" class="hidden bg-indigo-50 border border-indigo-200 rounded-xl p-5 mb-6 text-center"></div>

    <div id="quote" class="hidden">
      <div class="bg-white rounded-xl shadow p-6 mb-6">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-bold" id="quote-code"></h2>
            <p class="text-sm text-gray-500" id="quote-customer"></p>
            <div id="quote-status" class="mt-1"></div>
          </div>
          <div class="text-right">
            <p class="text-sm text-gray-500">Total do orçamento</p>
            <p class="text-xl font-bold text-gray-800" id="quote-total"></p>
            <p class="text-xs text-gray-500" id="quote-approved"></p>
          </div>
        </div>
        <p id="quote-shortage" class="hidden text-sm text-orange-600 mb-3">Algumas peças estão em falta no estoque e podem atrasar o serviço.</p>
        <div id="quote-items" class="space-y-3"></div>
        <div id="bulk-actions" class="hidden mt-6">
          <div class="flex gap-3">
            <button onclick="decideAll('approve')" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg text-sm">Aprovar todos</button>
            <button onclick="decideAll('reject')" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium py-3 rounded-lg text-sm">Reprovar todos</button>
          </div>
        </div>
        <div id="status-message" class="hidden mt-6 text-center p-4 rounded-lg"></div>
      </div>
    </div>

    <div id="lookup" class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="text-lg font-semibold mb-4">Consultar ordem de serviço</h2>
      <div class="space-y-4">
        <div>
          <label for="code" class="block text-sm font-medium text-gray-700 mb-1">Código da OS</label>
          <input id="code" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Ex: OS-20260507-A1B2">
        </div>
        <div>
          <label for="document" class="block text-sm font-medium text-gray-700 mb-1">Documento (CPF/CNPJ)</label>
          <input id="document" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Somente números">
        </div>
        <div id="lookup-error" class="text-red-600 text-sm hidden"></div>
        <button onclick="lookupWO()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm">Consultar</button>
      </div>
    </div>

    <div id="detail" class="hidden bg-white rounded-xl shadow p-6 mb-6">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-lg font-bold" id="wo-code"></h2>
          <div id="wo-status" class="mt-1"></div>
        </div>
        <div class="text-right">
          <p class="text-sm text-gray-500">Total estimado</p>
          <p class="text-xl font-bold text-gray-800" id="wo-total"></p>
        </div>
      </div>
      <div id="wo-services" class="space-y-2 mb-4"></div>
      <h3 class="text-sm font-semibold text-gray-700 mb-2">Histórico</h3>
      <ol id="wo-history" class="space-y-1 text-sm"></ol>
    </div>
  </div>

  <script type="module" src="/shared/app.js"></script>
  <script>
  window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const quoteId = params.get('quote') || '';
      let quote = null;
      let quotePaymentUrl = '';
      let woPaymentUrl = '';
      let polls = 0;

      document.getElementById('code').value = params.get('code') || '';
      document.getElementById('document').value = params.get('document') || '';

      function show(id, visible) { document.getElementById(id).classList.toggle('hidden', !visible); }

      function showStatusMsg(msg, cls) {
        const el = document.getElementById('status-message');
        el.textContent = msg;
        el.className = `mt-6 text-center p-4 rounded-lg text-sm font-medium ${cls}`;
      }

      function renderPayment() {
        const url = quotePaymentUrl || woPaymentUrl;
        const el = document.getElementById('payment');
        show('payment', !!url);
        if (!url) return;
        el.innerHTML = `<p class="text-indigo-800 font-medium mb-3">Orçamento aprovado. Falta apenas o pagamento para liberarmos o serviço.</p>
          <a href="${escapeAttr(url)}" target="_blank" rel="noopener" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-lg text-sm">Pagar agora</a>`;
      }

      function publicQuotePath(suffix) {
        return `/billing/public/quotes/${encodeURIComponent(quoteId)}${suffix || ''}`;
      }

      async function loadQuote() {
        if (!quoteId) return;
        try {
          renderQuote(await api.json(await api.get(publicQuotePath())));
        } catch (e) {
          show('quote', true);
          showStatusMsg('Não foi possível carregar o orçamento: ' + e.message, 'bg-red-50 text-red-700');
        }
      }

      function renderQuote(q) {
        quote = q;
        show('quote', true);
        document.getElementById('quote-code').textContent = 'Orçamento da OS ' + (q.work_order_code || '');
        document.getElementById('quote-customer').textContent = q.customer_name || '';
        document.getElementById('quote-status').innerHTML = metaBadge(QUOTE_STATUS_META, q.status);
        document.getElementById('quote-total').textContent = formatCents(q.total_cents || 0);
        document.getElementById('quote-approved').textContent = q.status === 'ENVIADO' ? '' : 'Aprovado: ' + formatCents(q.approved_total_cents || 0);
        show('quote-shortage', !!q.supply_shortage);

        const open = hasPendingDecision(q);
        document.getElementById('quote-items').innerHTML = (q.items || []).map(i => `
          <div class="border border-gray-200 rounded-lg p-4 flex items-center justify-between">
            <div>
              <span class="font-medium">${escapeHtml(i.title)}</span>
              <span class="ml-2 text-sm text-gray-500">${formatCents(i.price_cents || 0)}</span>
              <span class="ml-2">${metaBadge(DECISION_META, i.decision)}</span>
            </div>
            ${open && i.decision === 'PENDENTE' ? `<div class="flex items-center gap-2">
              <button onclick="decideItem('${escapeAttr(i.work_order_service_id)}','approve')" class="bg-green-100 hover:bg-green-200 text-green-700 px-3 py-1 rounded text-xs font-medium">Aprovar</button>
              <button onclick="decideItem('${escapeAttr(i.work_order_service_id)}','reject')" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1 rounded text-xs font-medium">Reprovar</button>
            </div>` : ''}
          </div>`).join('');
        show('bulk-actions', open);

        const messages = {
          APROVADO: ['Orçamento aprovado. Obrigado!', 'bg-green-50 text-green-700'],
          REPROVADO: ['Orçamento reprovado. Entraremos em contato para a devolução do veículo.', 'bg-red-50 text-red-700'],
          CANCELADO: ['Este orçamento foi cancelado.', 'bg-gray-100 text-gray-700'],
        };
        const msg = messages[q.status];
        if (msg) showStatusMsg(msg[0], msg[1]); else show('status-message', false);

        quotePaymentUrl = q.payment_url || '';
        renderPayment();
        if (q.status === 'APROVADO' && !quotePaymentUrl && polls < 10) {
          polls++;
          setTimeout(refreshAll, 3000);
        }
      }

      function refreshAll() {
        loadQuote();
        if (document.getElementById('code').value && document.getElementById('document').value) lookupWO();
      }

      async function decide(path) {
        try {
          const data = await api.json(await api.get(publicQuotePath(path)));
          if (data.quote) renderQuote(data.quote); else await loadQuote();
          if (data.message) showStatusMsg(data.message, 'bg-blue-50 text-blue-700');
          if (document.getElementById('code').value && document.getElementById('document').value) lookupWO();
        } catch (e) {
          await loadQuote();
          showStatusMsg('Não foi possível registrar a decisão: ' + e.message, 'bg-red-50 text-red-700');
        }
      }

      function decideItem(itemId, action) {
        decide(`/items/${encodeURIComponent(itemId)}/${action}`);
      }

      function decideAll(action) {
        const question = action === 'approve' ? 'Aprovar todos os itens pendentes?' : 'Reprovar todos os itens pendentes?';
        if (!confirm(question)) return;
        decide(`/${action}-all`);
      }

      async function lookupWO() {
        const code = document.getElementById('code').value.trim();
        const doc = document.getElementById('document').value.trim();
        const errEl = document.getElementById('lookup-error');
        errEl.classList.add('hidden');
        if (!code || !doc) { errEl.textContent = 'Preencha código e documento'; errEl.classList.remove('hidden'); return; }
        try {
          const resp = await api.get(`/public/work-orders/${encodeURIComponent(code)}?document=${encodeURIComponent(doc)}`);
          if (resp.status === 404) throw new Error('OS não encontrada');
          renderDetail(await api.json(resp));
        } catch (e) {
          errEl.textContent = e.message;
          errEl.classList.remove('hidden');
        }
      }

      function renderDetail(d) {
        show('detail', true);
        document.getElementById('wo-code').textContent = d.code;
        document.getElementById('wo-status').innerHTML = statusBadge(d.status);
        document.getElementById('wo-total').textContent = formatCents(d.total_estimated_price_cents || 0);
        document.getElementById('wo-services').innerHTML = (d.services || []).map(s => `
          <div class="flex items-center justify-between text-sm border-b pb-2">
            <span>${escapeHtml(s.title)}</span>
            <span class="flex gap-2">${metaBadge(DECISION_META, s.approval_status)}${metaBadge(ITEM_STATUS_META, s.status)}</span>
          </div>`).join('');
        document.getElementById('wo-history').innerHTML = (d.history || []).map(h => `
          <li class="flex items-center gap-3"><span class="text-xs text-gray-400 w-28">${escapeHtml(formatDate(h.changed_at))}</span>${statusBadge(h.status)}</li>`).join('');
        woPaymentUrl = d.payment_url || '';
        renderPayment();
      }

      refreshAll();
      document.getElementById('document').addEventListener('keydown', e => { if (e.key === 'Enter') lookupWO(); });

    Object.assign(window, { decideAll, decideItem, lookupWO });
  });
  </script>
</body>
</html>
