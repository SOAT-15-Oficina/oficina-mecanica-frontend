sonar.projectKey=oficina-mecanica-frontend
sonar.projectName=Oficina Mecanica - Painel web
sonar.projectVersion=3.0.0

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=tests

sonar.exclusions=node_modules/**,coverage/**,tests/**,.git/**,.scannerwork/**,.vscode/**,.github/**

# Fora da METRICA de cobertura -- continuam analisados para bugs e code smells.
#   *.html          logica de pagina acoplada ao DOM; exercita-la exigiria E2E,
#                   que foi deixado fora de escopo
#   shared/app.js   wiring de navegador (fetch, localStorage, innerHTML)
# As funcoes puras -- e em especial escapeHtml/escapeAttr, unica defesa contra
# XSS do painel -- moram em shared/helpers.js e SAO cobertas.
sonar.coverage.exclusions=**/*.html,shared/app.js,tests/**,vitest.config.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
